name: Publish npm release

on:
  release:
    types: [published]
  # Exercise the build and npm dry-run without publishing a new version.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  TURBO_UI: false
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  prepare:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require released source to be merged into master
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Node 22's bundled npm is too old for trusted publishing.
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm package-contract
      - run: pnpm release:pack
      - name: Test publishing without modifying npm
        if: github.event_name == 'workflow_dispatch'
        run: pnpm release:dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.run_id }}
          path: .context/npm-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.run_id }}
          path: .context/npm-release/
      # npm exchanges this job's OIDC identity for package-scoped credentials.
      # No NODE_AUTH_TOKEN or long-lived npm publishing secret is needed.
      - run: node scripts/npm-release.js --publish
