name: CI

on:
  push:
    branches: ["master"]
  pull_request:

# Superseded runs on a PR are pointless; cancel them. Never cancel a run on
# master, where every commit's result is a record worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `tui` is for interactive terminals; at concurrency 20 it interleaves into
  # unreadable CI logs.
  TURBO_UI: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Turbo cache
        with:
          path: .turbo/cache
          # Exact key per commit, falling back to any cache built against the
          # same lockfile so a source-only change warm-starts instead of
          # rebuilding from scratch.
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  # Every non-e2e gate. `pnpm check` runs format, dependency-versions, lint,
  # typecheck and unit tests with --continue=always, so one run reports all
  # failures rather than stopping at the first.
  #
  # This replaces what used to be four separate jobs (format, typecheck, lint,
  # test), each of which repeated the full install + build before doing any
  # work. The tradeoff is fewer status squares for a much shorter critical
  # path; --log-order=grouped keeps the failing gate easy to find in the log.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Restore turbo cache
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm check

  e2e:
    name: e2e (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    strategy:
      # One shard failing should not hide the results of the others.
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Restore turbo cache
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: Install Playwright browsers
        working-directory: apps/playwright
        run: pnpm exec playwright install --with-deps
      # No dev-server startup or port-wait steps here on purpose: the webServer
      # array in apps/playwright/playwright.config.ts owns starting every app,
      # waiting for it, and capturing its output. Each shard boots its own set,
      # which is what keeps the shards isolated from each other.
      #
      # Invoked directly rather than through `pnpm e2e` so --shard can be
      # passed; the e2e turbo task is `cache: false` anyway, so nothing is lost.
      - name: Run Playwright tests
        working-directory: apps/playwright
        run: pnpm exec playwright test ./tests/libs --shard=${{ matrix.shard }}
      - name: Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ strategy.job-index }}
          path: apps/playwright/blob-report/
          if-no-files-found: warn
          retention-days: 7

  e2e-report:
    name: e2e report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs even when a shard fails, so there is always a merged report to read.
    if: ${{ !cancelled() }}
    needs: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: apps/playwright/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into a single HTML report
        working-directory: apps/playwright
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/playwright/playwright-report/
          if-no-files-found: warn
          retention-days: 7
